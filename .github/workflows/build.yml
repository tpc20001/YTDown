# ☁ GitHub 雲端打包：推到 main（或在 Actions 頁按 Run workflow）→ 檢查 → 打包 APK → 發佈到 Releases
#   Releases 會有：<前綴>_V<版本>.zip（畫面更新包）、<id>_V<版本>_S<外殼>.apk（安裝檔）、update.json（App 讀這個）
#   版本沒變（tools/bump.py 沒跑）就不會重發，只試打包。其他分支只試打包，不發佈。
# 要先在 repo → Settings → Secrets and variables → Actions 加：
#   KEYSTORE_B64、KEYSTORE_PASS（電腦點 MAKE_GITHUB_KEY.bat 拿到）→ 打出來的 APK 才能直接蓋過手機上的
# 想讓程式碼 Private：另外開一個 Public repo 放更新檔，這個 repo 加 Secret RELEASE_TOKEN（能寫那個 repo 的 token）
#   和 Variable RELEASE_REPO（帳號/那個repo；那個 repo 建的時候要勾 Add a README）。App 會去 RELEASE_REPO 找更新。
name: Build
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RREPO: ${{ vars.RELEASE_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: 發佈的 repo 寫進 brand.json
        run: python3 tools/make_release.py brand --repo "$RREPO"
      - name: 檢查
        run: python3 tools/check.py --ci
      - name: 放上簽章鑰匙
        env: { KEYSTORE_B64: '${{ secrets.KEYSTORE_B64 }}' }
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > keystore/app.jks
          else echo "::warning::沒有 KEYSTORE_B64：這次用臨時鑰匙，手機上要先移除舊版才能裝（看設定精靈第 4 步）"; fi
      - name: 打包 APK
        env: { KEYSTORE_PASS: '${{ secrets.KEYSTORE_PASS }}' }
        run: gradle assembleRelease --no-daemon --console=plain
      - name: 做發佈的檔
        id: rel
        run: python3 tools/make_release.py files --apk "app/build/outputs/apk/release/*.apk"
      - uses: actions/upload-artifact@v4
        with: { name: '${{ steps.rel.outputs.tag }}', path: out/ }
      - name: 這版發過了嗎
        id: seen
        env: { GH_TOKEN: '${{ secrets.RELEASE_TOKEN || github.token }}' }
        run: |
          if gh release view "${{ steps.rel.outputs.tag }}" --repo "$RREPO" >/dev/null 2>&1; then echo "yes=1" >> $GITHUB_OUTPUT; echo "::notice::${{ steps.rel.outputs.tag }} 已經發過了（版本沒變），這次只試打包"; else echo "yes=0" >> $GITHUB_OUTPUT; fi
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && steps.seen.outputs.yes == '0'
        with:
          repository: ${{ env.RREPO }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          target_commitish: ${{ vars.RELEASE_REPO && 'main' || github.sha }}
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          files: out/*
          make_latest: true
